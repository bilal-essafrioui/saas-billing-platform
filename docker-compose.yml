version: '3.8'

services:

  # ═══ DATABASES ═══

  postgres-auth:
    image: postgres:15-alpine
    container_name: postgres-auth
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data

  postgres-subscription:
    image: postgres:15-alpine
    container_name: postgres-subscription
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: subscription_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres_subscription_data:/var/lib/postgresql/data

  postgres-billing:
    image: postgres:15-alpine
    container_name: postgres-billing
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: billing_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres_billing_data:/var/lib/postgresql/data

  postgres-payment:
    image: postgres:15-alpine
    container_name: postgres-payment
    ports:
      - "5436:5432"
    environment:
      POSTGRES_DB: payment_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres_payment_data:/var/lib/postgresql/data

  postgres-dunning:
    image: postgres:15-alpine
    container_name: postgres-dunning
    ports:
      - "5437:5432"
    environment:
      POSTGRES_DB: dunning_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres_dunning_data:/var/lib/postgresql/data

  postgres-notification:
    image: postgres:15-alpine
    container_name: postgres-notification
    ports:
      - "5438:5432"
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres_notification_data:/var/lib/postgresql/data

  # ═══ REDIS ═══

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"

  # ═══ KAFKA (KRaft — no Zookeeper) ═══

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: true
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

  # ═══ MAILHOG ═══

  mailhog:
    image: mailhog/mailhog
    container_name: mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

# ═══ VOLUMES ═══

volumes:
  postgres_auth_data:
  postgres_subscription_data:
  postgres_billing_data:
  postgres_payment_data:
  postgres_dunning_data:
  postgres_notification_data: